name: Update OTA checksum

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Download GitHub auto-zip
        run: |
          curl -L https://github.com/${{ github.repository }}/archive/refs/heads/main.zip -o main.zip

      - name: Generate SHA256 checksum
        run: sha256sum main.zip > checksum.txt

      - name: Commit and push checksum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checksum.txt
          git commit -m "Update OTA checksum"
          git push
